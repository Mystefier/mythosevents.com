name: Deploy to SiteGround
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public_html/
          server-dir: ./mythosevents.com/public_html/
          state-name: .ftp-deploy-state-mythosevents-repo.json
          exclude: |
            **/wp-content/**
            **/wp-admin/**
            **/wp-includes/**
            **/wp-*.php
            **/xmlrpc.php
            **/license.txt
            **/readme.html
